<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="SF Mono, Menlo, monospace">
  <!-- Background -->
  <rect width="820" height="520" rx="12" fill="#1c1c1e"/>

  <!-- Title bar -->
  <rect width="820" height="44" rx="12" fill="#2c2c2e"/>
  <rect y="32" width="820" height="12" fill="#2c2c2e"/>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="22" r="6" fill="#febc2e"/>
  <circle cx="56" cy="22" r="6" fill="#28c840"/>
  <text x="410" y="27" text-anchor="middle" fill="#ebebf5" font-size="13" font-weight="600" letter-spacing="0.3">Circuit</text>

  <!-- Tab bar -->
  <rect x="0" y="44" width="820" height="36" fill="#232323"/>
  <text x="24" y="66" fill="#5e5e62" font-size="11">Cortex</text>
  <text x="86" y="66" fill="#5e5e62" font-size="11">Trace</text>
  <text x="140" y="66" fill="#5e5e62" font-size="11">Intervene</text>
  <text x="210" y="66" fill="#5e5e62" font-size="11">Verify</text>
  <text x="264" y="66" fill="#64d2ff" font-size="11" font-weight="600">Circuit</text>
  <line x1="264" y1="79" x2="296" y2="79" stroke="#64d2ff" stroke-width="2"/>

  <!-- Page header -->
  <text x="24" y="110" fill="#ebebf5" font-size="20" font-weight="700">Circuit</text>
  <text x="24" y="130" fill="#8e8e93" font-size="11">Activation patching sweep: which heads are critical to the circuit?</text>

  <!-- Prompt pair card -->
  <rect x="24" y="148" width="772" height="118" rx="10" fill="#2c2c2e"/>
  <text x="40" y="170" fill="#ebebf5" font-size="13" font-weight="600">Prompt pair</text>
  <text x="40" y="186" fill="#636366" font-size="10">Clean is the baseline; corrupted is the altered version. Each head is scored by how much its attention shifts between them.</text>

  <!-- Clean input -->
  <rect x="40" y="196" width="356" height="30" rx="6" fill="#3a3a3c"/>
  <text x="48" y="208" fill="#636366" font-size="9" font-weight="600">CLEAN</text>
  <text x="48" y="221" fill="#ebebf5" font-size="11">the quick fox jumped</text>

  <!-- Corrupted input -->
  <rect x="408" y="196" width="356" height="30" rx="6" fill="#3a3a3c"/>
  <text x="416" y="208" fill="#636366" font-size="9" font-weight="600">CORRUPTED</text>
  <text x="416" y="221" fill="#ebebf5" font-size="11">the lazy dog sat</text>

  <!-- Run sweep button -->
  <rect x="40" y="234" width="126" height="24" rx="6" fill="#64d2ff"/>
  <text x="70" y="250" fill="#1c1c1e" font-size="11" font-weight="600">⌖  Run sweep</text>

  <!-- Heatmap card -->
  <rect x="24" y="278" width="772" height="170" rx="10" fill="#2c2c2e"/>
  <text x="40" y="300" fill="#ebebf5" font-size="13" font-weight="600">IOI importance heatmap</text>
  <text x="40" y="315" fill="#636366" font-size="10">Brighter cell = larger total-variation distance between clean and corrupted attention at that head.</text>

  <!-- Axis labels: heads -->
  <text x="74" y="335" fill="#636366" font-size="9" text-anchor="middle">H0</text>
  <text x="124" y="335" fill="#636366" font-size="9" text-anchor="middle">H1</text>
  <text x="174" y="335" fill="#636366" font-size="9" text-anchor="middle">H2</text>
  <text x="224" y="335" fill="#636366" font-size="9" text-anchor="middle">H3</text>

  <!-- Row L0 -->
  <text x="52" y="361" fill="#636366" font-size="9" text-anchor="end">L0</text>
  <rect x="57" y="342" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.45"/>
  <text x="79" y="361" fill="#ebebf5" font-size="9" text-anchor="middle">18</text>

  <!-- L0H1 — SELECTED (bright, teal ring) -->
  <rect x="107" y="342" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.92"/>
  <rect x="107" y="342" width="44" height="30" rx="5" fill="none" stroke="#64d2ff" stroke-width="2"/>
  <text x="129" y="361" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">87</text>

  <rect x="157" y="342" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.28"/>
  <text x="179" y="361" fill="#ebebf5" font-size="9" text-anchor="middle">11</text>

  <rect x="207" y="342" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.60"/>
  <text x="229" y="361" fill="#ffffff" font-size="9" text-anchor="middle">53</text>

  <!-- Row L1 -->
  <text x="52" y="401" fill="#636366" font-size="9" text-anchor="end">L1</text>
  <rect x="57" y="382" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.72"/>
  <text x="79" y="401" fill="#ffffff" font-size="9" text-anchor="middle">63</text>

  <rect x="107" y="382" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.34"/>
  <text x="129" y="401" fill="#ebebf5" font-size="9" text-anchor="middle">29</text>

  <rect x="157" y="382" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.84"/>
  <text x="179" y="401" fill="#ffffff" font-size="9" text-anchor="middle">76</text>

  <rect x="207" y="382" width="44" height="30" rx="5" fill="#ff6b35" opacity="0.18"/>
  <text x="229" y="401" fill="#ebebf5" font-size="9" text-anchor="middle">7</text>

  <!-- Selected chip -->
  <rect x="57" y="422" width="68" height="18" rx="9" fill="#64d2ff" opacity="0.22"/>
  <text x="91" y="434" fill="#64d2ff" font-size="9" font-weight="600" text-anchor="middle">L0 · H1</text>
  <text x="134" y="434" fill="#636366" font-size="9">importance 0.87  ·  tap another cell to compare</text>

  <!-- Head detail card -->
  <rect x="24" y="460" width="772" height="46" rx="10" fill="#2c2c2e"/>
  <text x="40" y="480" fill="#ebebf5" font-size="12" font-weight="600">L0 · H1 — attention on clean input</text>
  <text x="40" y="496" fill="#636366" font-size="10">Post-softmax weights on "the quick fox jumped". Rows = query positions, columns = key positions; each row sums to 1.</text>

  <!-- Legend -->
  <defs>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <rect x="650" y="342" width="130" height="10" rx="4" fill="url(#heat)"/>
  <text x="650" y="367" fill="#636366" font-size="9">low importance</text>
  <text x="739" y="367" fill="#636366" font-size="9" text-anchor="end">high</text>
</svg>
