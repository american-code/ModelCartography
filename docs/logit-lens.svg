<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="SF Mono, Menlo, monospace">
  <!-- Background -->
  <rect width="820" height="420" rx="12" fill="#1c1c1e"/>

  <!-- Title bar -->
  <rect width="820" height="44" rx="12" fill="#2c2c2e"/>
  <rect y="32" width="820" height="12" fill="#2c2c2e"/>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="22" r="6" fill="#febc2e"/>
  <circle cx="56" cy="22" r="6" fill="#28c840"/>
  <text x="410" y="27" text-anchor="middle" fill="#ebebf5" font-size="13" font-weight="600" letter-spacing="0.3">Trace — Logit Lens</text>

  <!-- Tab bar -->
  <rect x="0" y="44" width="820" height="36" fill="#232323"/>
  <text x="24" y="66" fill="#5e5e62" font-size="11">Cortex</text>
  <text x="86" y="66" fill="#64d2ff" font-size="11" font-weight="600">Trace</text>
  <line x1="86" y1="79" x2="108" y2="79" stroke="#64d2ff" stroke-width="2"/>
  <text x="140" y="66" fill="#5e5e62" font-size="11">Intervene</text>
  <text x="210" y="66" fill="#5e5e62" font-size="11">Verify</text>
  <text x="264" y="66" fill="#5e5e62" font-size="11">Circuit</text>

  <!-- Section header -->
  <text x="24" y="110" fill="#ebebf5" font-size="16" font-weight="700">Logit lens</text>
  <text x="24" y="128" fill="#636366" font-size="10">top-5 predicted tokens at each residual stream layer — confidence sharpens with depth</text>

  <!-- Lens card -->
  <rect x="24" y="140" width="772" height="262" rx="10" fill="#2c2c2e"/>

  <!-- Table header -->
  <text x="42" y="165" fill="#636366" font-size="10" font-weight="700">LAYER</text>
  <text x="130" y="165" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">#1</text>
  <text x="226" y="165" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">#2</text>
  <text x="322" y="165" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">#3</text>
  <text x="418" y="165" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">#4</text>
  <text x="514" y="165" fill="#636366" font-size="10" font-weight="700" text-anchor="middle">#5</text>
  <line x1="40" y1="172" x2="600" y2="172" stroke="#3a3a3c" stroke-width="1"/>

  <!-- Row: embed (pre-layer 0) -->
  <text x="42" y="198" fill="#8e8e93" font-size="10" font-family="SF Mono, Menlo, monospace">embed</text>

  <!-- #1 cell - not top -->
  <rect x="90" y="180" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.8"/>
  <text x="132" y="196" fill="#ebebf5" font-size="10" text-anchor="middle">fox</text>
  <text x="132" y="208" fill="#8e8e93" font-size="9" text-anchor="middle">14%</text>

  <rect x="186" y="180" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.6"/>
  <text x="228" y="196" fill="#ebebf5" font-size="10" text-anchor="middle">cat</text>
  <text x="228" y="208" fill="#8e8e93" font-size="9" text-anchor="middle">13%</text>

  <rect x="282" y="180" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.4"/>
  <text x="324" y="196" fill="#ebebf5" font-size="10" text-anchor="middle">dog</text>
  <text x="324" y="208" fill="#8e8e93" font-size="9" text-anchor="middle">11%</text>

  <rect x="378" y="180" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.3"/>
  <text x="420" y="196" fill="#ebebf5" font-size="10" text-anchor="middle">the</text>
  <text x="420" y="208" fill="#8e8e93" font-size="9" text-anchor="middle">10%</text>

  <rect x="474" y="180" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.2"/>
  <text x="516" y="196" fill="#ebebf5" font-size="10" text-anchor="middle">bird</text>
  <text x="516" y="208" fill="#8e8e93" font-size="9" text-anchor="middle">9%</text>

  <line x1="40" y1="220" x2="600" y2="220" stroke="#3a3a3c" stroke-width="0.5" opacity="0.5"/>

  <!-- Row: layer 0 -->
  <text x="42" y="248" fill="#8e8e93" font-size="10" font-family="SF Mono, Menlo, monospace">layer 0</text>

  <!-- #1 - top! Signal color -->
  <rect x="90" y="230" width="84" height="34" rx="5" fill="#ff6b35" opacity="0.55"/>
  <text x="132" y="246" fill="#ff6b35" font-size="10" font-weight="600" text-anchor="middle">jumped</text>
  <text x="132" y="258" fill="#ff6b35" font-size="9" text-anchor="middle" opacity="0.85">38%</text>

  <rect x="186" y="230" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.55"/>
  <text x="228" y="246" fill="#ebebf5" font-size="10" text-anchor="middle">fox</text>
  <text x="228" y="258" fill="#8e8e93" font-size="9" text-anchor="middle">22%</text>

  <rect x="282" y="230" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.35"/>
  <text x="324" y="246" fill="#ebebf5" font-size="10" text-anchor="middle">quick</text>
  <text x="324" y="258" fill="#8e8e93" font-size="9" text-anchor="middle">15%</text>

  <rect x="378" y="230" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.2"/>
  <text x="420" y="246" fill="#ebebf5" font-size="10" text-anchor="middle">sat</text>
  <text x="420" y="258" fill="#8e8e93" font-size="9" text-anchor="middle">11%</text>

  <rect x="474" y="230" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.15"/>
  <text x="516" y="246" fill="#ebebf5" font-size="10" text-anchor="middle">flew</text>
  <text x="516" y="258" fill="#8e8e93" font-size="9" text-anchor="middle">8%</text>

  <line x1="40" y1="270" x2="600" y2="270" stroke="#3a3a3c" stroke-width="0.5" opacity="0.5"/>

  <!-- Row: layer 1 (final) — very confident -->
  <text x="42" y="298" fill="#8e8e93" font-size="10" font-family="SF Mono, Menlo, monospace">layer 1</text>

  <!-- #1 - very bright top -->
  <rect x="90" y="280" width="84" height="34" rx="5" fill="#ff6b35" opacity="0.92"/>
  <text x="132" y="296" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">jumped</text>
  <text x="132" y="308" fill="#ffffff" font-size="9" text-anchor="middle" opacity="0.9">81%</text>

  <rect x="186" y="280" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.4"/>
  <text x="228" y="296" fill="#ebebf5" font-size="10" text-anchor="middle">fox</text>
  <text x="228" y="308" fill="#8e8e93" font-size="9" text-anchor="middle">7%</text>

  <rect x="282" y="280" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.2"/>
  <text x="324" y="296" fill="#ebebf5" font-size="10" text-anchor="middle">quick</text>
  <text x="324" y="308" fill="#8e8e93" font-size="9" text-anchor="middle">4%</text>

  <rect x="378" y="280" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.15"/>
  <text x="420" y="296" fill="#ebebf5" font-size="10" text-anchor="middle">bird</text>
  <text x="420" y="308" fill="#8e8e93" font-size="9" text-anchor="middle">3%</text>

  <rect x="474" y="280" width="84" height="34" rx="5" fill="#3a3a3c" opacity="0.1"/>
  <text x="516" y="296" fill="#ebebf5" font-size="10" text-anchor="middle">cat</text>
  <text x="516" y="308" fill="#8e8e93" font-size="9" text-anchor="middle">2%</text>

  <!-- Confidence arrow annotation -->
  <line x1="620" y1="197" x2="620" y2="297" stroke="#64d2ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64d2ff"/>
    </marker>
  </defs>
  <text x="634" y="246" fill="#64d2ff" font-size="10" font-weight="600">confidence</text>
  <text x="634" y="259" fill="#64d2ff" font-size="10">sharpens</text>
  <text x="634" y="272" fill="#64d2ff" font-size="10">with depth</text>

  <!-- Input label -->
  <text x="42" y="356" fill="#636366" font-size="10">Input: "the quick fox jumped"    →    Final prediction: <tspan fill="#ff6b35" font-weight="700">jumped</tspan>  <tspan fill="#ff6b35">81%</tspan></text>
  <text x="42" y="375" fill="#636366" font-size="9">Adapter: Hooked GPT-2 · Interp demo (2L 2H d=16)</text>
  <text x="42" y="391" fill="#636366" font-size="9">Logit lens powered by SwiftSci Interp · LogitLens</text>
</svg>
